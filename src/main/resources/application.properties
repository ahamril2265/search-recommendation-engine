# --- Server ---
# Different port from your booking-system project so both can run side by side
server.port=8082

# --- Postgres ---
spring.datasource.url=jdbc:postgresql://localhost:5432/search_engine_db
spring.datasource.username=postgres
spring.datasource.password=ahamed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Elasticsearch ---
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.scheme=http

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Kafka (values unused until Day 5, but wired up now) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=search-engine-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
